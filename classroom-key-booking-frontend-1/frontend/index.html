<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Key Booking &mdash; Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-brand">
  <div class="key-mark">🔑</div>
  <span>KeyBook</span>
</div>

<div class="auth-page">
  <div class="auth-card" id="authCard">

    <!-- LOGIN VIEW -->
    <div class="auth-panel" id="loginPanel">
      <div class="auth-icon">🔐</div>
      <h2>Sign in</h2>
      <p class="sub">Book a classroom key without the paper logbook.</p>

      <div class="form-error" id="loginError"></div>

      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@school.edu" required>
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="At least 8 characters" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign in</button>
      </form>

      <div class="auth-switch">
        New here?
        <button type="button" id="showSignup">Create an account</button>
      </div>
    </div>

    <!-- SIGNUP VIEW -->
    <div class="auth-panel view-hidden" id="signupPanel">
      <div class="auth-icon">🗝️</div>
      <h2>Create your account</h2>
      <p class="sub">Register with your student index number to start booking.</p>

      <div class="form-error" id="signupError"></div>

      <form id="signupForm">
        <div class="field">
          <label for="signupName">Full name</label>
          <input type="text" id="signupName" placeholder="Ada Lovelace" required>
        </div>
        <div class="field">
          <label for="signupIndex">Index number</label>
          <input type="text" id="signupIndex" placeholder="e.g. 8800123" required>
        </div>
        <div class="field">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="you@school.edu" required>
        </div>
        <div class="field">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="At least 8 characters" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="signupBtn">Create account</button>
      </form>

      <div class="auth-switch">
        Already have an account?
        <button type="button" id="showLogin">Sign in</button>
      </div>
    </div>

  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
